name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stridebook
          POSTGRES_PASSWORD: stridebook
          POSTGRES_DB: stridebook_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://stridebook:stridebook@localhost:5432/stridebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # On main only: build the three images and push them to GitHub Container Registry,
  # tagged with the commit SHA and "latest". Deploy with infra/deploy.sh <fqdn> <sha>.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: backend, file: backend/Dockerfile }
          - { name: web, context: ., file: deploy/caddy/Dockerfile }
          - { name: backup, context: deploy/backup, file: deploy/backup/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/stridebook-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/stridebook-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
